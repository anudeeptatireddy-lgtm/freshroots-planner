name: Keep the Streamlit app awake

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours; Streamlit Cloud sleeps an app after ~12 hours with no visitor
  workflow_dispatch: {}          # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.49.1 && playwright install --with-deps chromium
      - name: Visit the app (wakes it if asleep; fails loudly if it is private)
        env:
          APP_URL: ${{ vars.APP_URL || 'https://anudeeptatireddy-lgtm-freshroots-planner-appreview-app-wxuoaz.streamlit.app' }}
        run: python scripts/keepalive.py
