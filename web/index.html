<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Freshroots Review</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1c2a24;--mute:#66736c;--line:#dfe4de;--brand:#1f4e3d;--warn:#fff4d6;--warnink:#6b4e00;--ok:#e3f3e8;--bad:#fde6e4;--info:#e6eefb}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--card:#1a211d;--ink:#e8efe9;--mute:#9aa8a0;--line:#2b352f;--brand:#4aa37f;--warn:#3a3016;--warnink:#f1d58a;--ok:#16301f;--bad:#3a1a18;--info:#16253d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
header{padding:20px 0 8px}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:26px 0 10px}
.sub{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px}
.stat span{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.card>summary{list-style:none;padding:14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card>summary::-webkit-details-marker{display:none}
.card .body{padding:0 14px 14px}
.sku{font-weight:650}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:2px 9px;margin:3px 4px 0 0;background:var(--info)}
.tag.urgent{background:var(--bad)}
.tag.done{background:var(--ok)}
.tag.wait{background:var(--warn);color:var(--warnink)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.nums div{background:var(--bg);border-radius:10px;padding:8px}
.nums b{display:block;font-size:17px}
.nums span{font-size:12px;color:var(--mute)}
.note{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.note.warn{background:var(--warn);color:var(--warnink)}
.note.info{background:var(--info)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 8px}
button,input[type=number],input[type=text]{font:inherit;color:inherit}
.seg button{padding:12px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);min-height:46px}
.seg button.on{border-color:var(--brand);background:var(--brand);color:#fff}
input[type=number],input[type=text]{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);margin:6px 0;min-height:46px}
label{font-size:13px;color:var(--mute)}
.primary{width:100%;padding:15px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-weight:650;min-height:50px}
.primary:disabled{opacity:.45}
.err{background:var(--bad);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.dl{display:block;padding:13px 14px;margin:8px 0;border:1.5px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
pre{white-space:pre-wrap;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
</style>
</head>
<body>
<header>
  <h1>Freshroots review</h1>
  <div class="sub" id="sub">Loading…</div>
</header>
<div id="app"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v, d=0) => v == null ? 'n/a' : Number(v).toLocaleString(undefined, {maximumFractionDigits: d, minimumFractionDigits: d});
let PLAN = null, STATE = {reviewer: '', decisions: {}};
let KEY = '';

function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) STATE = s; } catch (e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(STATE)); } catch (e) {} }

async function init() {
  try {
    const r = await fetch('/api/plan'); PLAN = await r.json();
    if (!r.ok) throw new Error(PLAN.error || r.status);
  } catch (e) { $('#sub').textContent = 'Could not load the plan: ' + e.message; return; }
  KEY = 'fr-review-' + PLAN.run_date;
  load(); render();
}

const exceptions = () => PLAN.rows.filter(r => r.status === 'NEEDS_REVIEW')
  .sort((a, b) => (b.is_urgent - a.is_urgent) || a.sku_id.localeCompare(b.sku_id));
const autos = () => PLAN.rows.filter(r => r.status === 'AUTO_APPROVED');
const pending = () => exceptions().filter(r => !STATE.decisions[r.sku_id]);

function setDecision(sku, decision) {
  const row = PLAN.rows.find(r => r.sku_id === sku);
  const prev = STATE.decisions[sku] || {};
  const qty = decision === 'edit' ? (prev.qty ?? row.suggested_qty ?? row.order_qty) : decision === 'reject' ? 0 : row.order_qty;
  STATE.decisions[sku] = {decision, qty, note: prev.note || '', ts: new Date().toISOString().slice(0, 19)};
  save(); render(sku);
}
function setField(sku, field, v) {
  const d = STATE.decisions[sku]; if (!d) return;
  d[field] = field === 'qty' ? (v === '' ? 0 : Math.max(0, Math.round(Number(v)))) : v; save();
}
function clearDecision(sku) { delete STATE.decisions[sku]; save(); render(sku); }

function card(r, open) {
  const d = STATE.decisions[r.sku_id];
  const tags = (r.exceptions ? r.exceptions.split('; ') : []).map(c => `<span class="tag">${esc(c)}</span>`).join('')
    + (r.is_urgent ? '<span class="tag urgent">URGENT</span>' : '');
  const state = r.status === 'NEEDS_REVIEW'
    ? (d ? `<span class="tag done">${esc(d.decision)} · ${num(d.qty)}</span>` : '<span class="tag wait">waiting</span>')
    : (d ? `<span class="tag done">${esc(d.decision)} · ${num(d.qty)}</span>` : '');
  const reasons = (r.exception_reasons ? r.exception_reasons.split(' | ') : []).map(t => `<div class="note warn">${esc(t)}</div>`).join('');
  const sug = r.suggested_qty != null ? `<div class="note info">Suggested alternative: <b>${num(r.suggested_qty)}</b> units. ${esc(r.suggested_note)}</div>` : '';
  const seg = ['approve', 'edit', 'reject'].map(x => `<button class="${d && d.decision === x ? 'on' : ''}" onclick="setDecision('${r.sku_id}','${x}')">${x === 'edit' ? 'Edit qty' : x[0].toUpperCase() + x.slice(1)}</button>`).join('');
  const edit = d && d.decision === 'edit' ? `<label>Quantity</label><input type="number" inputmode="numeric" min="0" step="1" value="${d.qty}" onchange="setField('${r.sku_id}','qty',this.value)">` : '';
  const note = d ? `<label>Note (optional)</label><input type="text" value="${esc(d.note)}" onchange="setField('${r.sku_id}','note',this.value)">
    <button class="seg-clear" style="background:none;border:0;color:var(--mute);padding:8px 0" onclick="clearDecision('${r.sku_id}')">Undo decision</button>` : '';
  return `<details class="card" id="c-${r.sku_id}" ${open ? 'open' : ''}>
    <summary><div><div class="sku">${esc(r.sku_id)} · ${esc(r.sku_name)}</div><div>${tags}</div></div><div>${state}</div></summary>
    <div class="body">
      <div class="nums">
        <div><b>${num(r.units_on_hand)}</b><span>On hand</span></div>
        <div><b>${num(r.weeks_of_cover, 2)}</b><span>Cover now (wks)</span></div>
        <div><b>${num(r.weeks_of_cover_after_order, 2)}</b><span>Cover after</span></div>
        <div><b>${r.change_4w_vs_12w == null ? 'n/a' : (r.change_4w_vs_12w >= 0 ? '+' : '') + (r.change_4w_vs_12w * 100).toFixed(1) + '%'}</b><span>4w vs 12w</span></div>
        <div><b>${num(r.order_qty)}</b><span>System qty</span></div>
        <div><b>${r.min_weeks ?? 'n/a'} / ${r.max_weeks ?? 'n/a'}</b><span>Min / max wks</span></div>
      </div>
      <div><b>Rule:</b> ${esc(r.flag)}. ${esc(r.flag_reasons)}</div>
      ${reasons}${sug}
      <div class="seg">${seg}</div>${edit}${note}
    </div></details>`;
}

function render(keepOpen) {
  const ex = exceptions(), au = autos(), pend = pending();
  $('#sub').textContent = `Run date ${PLAN.run_date} · ${PLAN.rows.length} SKUs`;
  const open = new Set([...document.querySelectorAll('details.card[open]')].map(e => e.id));
  if (keepOpen) open.add('c-' + keepOpen);
  const flags = Object.entries(PLAN.flag_counts).map(([k, v]) => `${esc(k)}: ${v}`).join(' · ');
  $('#app').innerHTML = `
    <div class="grid">
      <div class="stat"><b>${PLAN.rows.length}</b><span>SKUs processed</span></div>
      <div class="stat"><b>${pend.length}</b><span>Exceptions waiting</span></div>
      <div class="stat"><b>${au.length}</b><span>Lines ready</span></div>
      <div class="stat"><b>${ex.length - pend.length}</b><span>Exceptions decided</span></div>
    </div>
    <div class="sub">Flags: ${flags || 'none'}</div>
    <h2>Exceptions</h2>
    ${ex.length ? ex.map(r => card(r, open.has('c-' + r.sku_id) || (!STATE.decisions[r.sku_id] && !open.size))).join('') : '<div class="note info">No exceptions this run.</div>'}
    <h2>Auto-approved lines</h2>
    <div class="sub">No decision needed; edit or reject if you want. Undecided ones go on the PO at the system quantity.</div>
    ${au.map(r => card(r, open.has('c-' + r.sku_id))).join('')}
    <details class="card"><summary><div class="sku">All SKUs</div></summary><div class="body scroll"><table>
      <tr><th>SKU</th><th>Cover</th><th>Flag</th><th>Order</th></tr>
      ${PLAN.rows.map(r => `<tr><td>${esc(r.sku_id)}</td><td>${num(r.weeks_of_cover, 1)}</td><td>${esc(r.flag)}</td><td>${num(r.order_qty)}</td></tr>`).join('')}
    </table></div></details>
    <h2>Purchase orders</h2>
    <label>Your name (required)</label>
    <input type="text" id="reviewer" value="${esc(STATE.reviewer)}" placeholder="e.g. Raghav" oninput="STATE.reviewer=this.value;save();sync()">
    <div class="err" id="block" ${pend.length ? '' : 'hidden'}>Cannot generate POs: ${pend.length} exception(s) still need a decision (${pend.map(r => r.sku_id).join(', ')}).</div>
    <button class="primary" id="gen" onclick="generate()">Generate purchase orders</button>
    <div id="result"></div>`;
  sync();
}
function sync() { const b = $('#gen'); if (b) b.disabled = pending().length > 0 || !STATE.reviewer.trim(); }

async function generate() {
  const btn = $('#gen'); btn.disabled = true; btn.textContent = 'Generating…';
  const out = $('#result'); out.innerHTML = '';
  try {
    const r = await fetch('/api/generate', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({reviewer: STATE.reviewer, decisions: STATE.decisions})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    const links = Object.entries(j.files).map(([name, f]) => {
      const bin = atob(f.b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
      return `<a class="dl" download="${esc(name)}" href="${URL.createObjectURL(new Blob([a], {type: f.mime}))}">Download ${esc(name)}</a>`;
    }).join('');
    const rate = j.stats.override_rate == null || !j.stats.human_decisions ? 'n/a' : (j.stats.override_rate * 100).toFixed(0) + '%';
    out.innerHTML = `<h2>${j.po_count} PO(s) generated</h2>
      <div class="scroll"><table><tr><th>PO</th><th>Vendor</th><th>SKU</th><th>Qty</th><th>Notes</th></tr>
      ${j.lines.map(l => `<tr><td>${esc(l.po_number)}</td><td>${esc(l.vendor_name)}</td><td>${esc(l.sku_id)}</td><td>${num(l.quantity)}</td><td>${esc(l.notes)}</td></tr>`).join('')}</table></div>
      <div class="sub" style="margin-top:8px">Override rate: ${rate} (${j.stats.overrides} of ${j.stats.decided_lines} lines). ${PLAN.counterparty_label}: confirm the real supplier before release.</div>
      <h2>Downloads</h2>${links}<h2>Summary</h2><pre>${esc(j.summary)}</pre>`;
  } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  btn.textContent = 'Generate purchase orders'; sync();
}
init();
</script>
</body>
</html>
