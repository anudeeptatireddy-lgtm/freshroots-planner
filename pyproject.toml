[project]
name = "freshroots-planner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas", "pyyaml", "reportlab", "psycopg[binary]"]

[project.optional-dependencies]
dev = ["pytest", "pypdf", "ruff"]
app = ["streamlit"]
ai = ["anthropic"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "C4", "UP", "I"]
ignore = ["B905", "E501"]

[tool.ruff.lint.per-file-ignores]
"app/review_app.py" = ["E402", "I001"]
