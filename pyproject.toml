[project]
name = "freshroots-planner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas", "pyyaml", "reportlab", "flask"]

[project.optional-dependencies]
dev = ["pytest", "pypdf"]
app = ["streamlit"]
ai = ["anthropic"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
